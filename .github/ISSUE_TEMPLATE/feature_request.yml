name: Feature request
description: Suggest an idea or improvement for the project
title: "[feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project!

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this feature solve?
      placeholder: |
        Currently, it is difficult to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or improvement you would like.
      placeholder: |
        I would like the script to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have considered.

  - type: textarea
    id: example
    attributes:
      label: Example
      description: If applicable, show how you imagine the feature being used.
      render: python

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, examples, links, or any other useful information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and did not find a duplicate.
          required: true