# =============================================================================
# doguc — configuration
# =============================================================================

[gateway]
# true  = user:pass@host:port endpoint (recommended)
# false = static list from file (proxies.txt)
enabled = true
host = "proxy.example.com"
port = 8080
user = "YOUR_USER"
password = "YOUR_PASSWORD"

# false = reuse the IP (sessid + keep-alive) until a 429, then rotate.
# true  = new IP on EVERY request (fewer 429s, lower RPS).
unique_session_per_request = false

# Parallel sticky IPs. Each slot is one sessid, reused until a 429.
# Set this ≈ max_concurrent (1 in-flight request per IP).
sessions = 400

# Sticky session encoded in the proxy username. Not provider-specific code:
# copy the format from your gateway docs. Placeholders: {user} {session} {lifetime}
#
#   "{user};sessid.{session}"                         # DataImpulse
#   "{user}-session-{session}-lifetime-{lifetime}"    # ProxyScrape
#   "{user}-session-{session}"                        # Bright Data / many
#   "{user}_session-{session}"                        # IPRoyal
#
username_template = "{user};sessid.{session}"

[files]
usernames = "data/usernames.txt"
proxies = "proxies.txt"
# Persisted hits: rerunning the checker skips names already in these files.
available = "available.txt"
taken = "taken.txt"
# Usernames abandoned after max_retries (retried on the next run).
errors = "errors.txt"

[debug]
# true = one line per request (username + exit IP). Cuts RPS hard.
enabled = false
# Resolve the public IP via ipify through the same proxy. false = username only.
show_exit_ip = true

[performance]
# Concurrent HTTP requests (semaphore + TCP connector limit).
# 200–400 is a cautious start; 800+ if network errors stay low.
max_concurrent = 400
# Queue consumers. A bit above max_concurrent to absorb retries.
workers = 450
# Small delay after acquiring a slot. Leave at 0 in rotating mode.
base_delay = 0.0
# aiohttp timeouts (seconds). Short values free workers quickly on a dead proxy.
request_timeout = 8
connect_timeout = 4
# TCP pool keep-alive (seconds). The tunnel is reused until a 429.
keepalive_timeout = 30
# true = new TCP connection on every request (breaks IP reuse — leave false).
force_close = false
# Rich UI refresh rate (Hz).
ui_refresh_hz = 4
# Attempts per username (429 / network) before writing to errors.txt.
max_retries = 5
# Backoff + jitter (seconds) on NETWORK errors only. A 429 retries immediately.
retry_backoff_base = 0.05
retry_backoff_cap = 1.5
# Flush to disk every N hits (no fsync per line — too slow at high RPS).
flush_every = 50

[rate_limit]
# No hardcoded Discord limit. remaining comes from response headers.
# list: if remaining <= threshold → drop that IP, no global sleep.
low_remaining_threshold = 0
# list: too many consecutive 429s → extra cooldown on THIS proxy only.
max_429_before_cooldown = 3
# list: N consecutive network failures → proxy marked dead temporarily.
dead_after_failures = 8
dead_cooldown_seconds = 30
# list: max in-flight requests per IP (1 = one request at a time per session).
max_inflight_per_ip = 1

[pause]
# Trip when this many network errors land within window_seconds. 429s do not count.
# Stays paused until there are no network errors for quiet_seconds (timer resets on each one).
# A few probe requests keep running so we can tell when the storm is actually over.
error_limit = 250
window_seconds = 4
quiet_seconds = 8
probes = 8

[cloudflare]
# 10,000 invalid requests / 10 minutes / IP.
# Counted: 401, 403, and 429 except scope "shared".
window_seconds = 600
limit = 9500
